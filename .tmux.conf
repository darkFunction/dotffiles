set -g default-terminal 'screen-256color'
setw -g mode-keys vi
set -g mouse on

# Smoother mouse-wheel scrolling: tmux default scrolls 5 lines/notch (-N 5).
# 1 line/notch — finest tmux can do (it scrolls by whole rows, no pixel scroll).
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

#unbind C-b
#set -g prefix C-Space
#bind C-Space send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#bind-key -n M-Left select-pane -L
#bind-key -n M-Down select-pane -D
#bind-key -n M-Up select-pane -U
#bind-key -n M-Right select-pane -R

bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

unbind r
bind r source-file ~/.tmux.conf

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @dracula-plugins "battery cpu-usage ram-usage gpu-usage network network-bandwidth"
set -g @dracula-show-powerline true

run '~/.tmux/plugins/tpm/tpm'

# --- Make the selected window obvious in the status bar ---
# Placed after tpm so it overrides any theme (incl. Dracula once installed).
# Current window: solid pink block, bold dark text. Inactive: dimmed.
setw -g window-status-current-style 'fg=#282a36,bg=#ff79c6,bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'dim'
setw -g window-status-format ' #I:#W#F '

# --- Dim inactive panes so the focused one pops ---
set -g window-style 'fg=#888888,bg=#1e1f29'
set -g window-active-style 'fg=#f8f8f2,bg=#282a36'
